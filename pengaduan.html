<!doctype html><html lang="id"><head><title>Pengaduan | Desa Bugangan</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css"></head><body data-page="pengaduan.html"><section class=ph><div class=wrap><h1>Pengaduan Warga</h1><p>Sampaikan keluhan atau masukan untuk Desa Bugangan. Nama dan kontak boleh dikosongkan.</p></div></section>
<main class=wrap><div class=grid><form class='panel form' id=af><h3>Kirim pengaduan</h3><input name=nama placeholder='Nama (opsional)' maxlength=80><input name=kontak placeholder='No. HP atau email (opsional)' maxlength=80>
<select name=kategori aria-label=Kategori><option>Infrastruktur</option><option>Kebersihan</option><option>Pelayanan administrasi</option><option>Keamanan</option><option>Lainnya</option></select>
<textarea name=isi rows=6 required minlength=10 maxlength=1500 placeholder='Tulis pengaduan kamu dengan jelas, termasuk lokasi kejadian'></textarea><input class=hp name=website tabindex=-1 autocomplete=off aria-hidden=true>
<button class=btn>Kirim pengaduan</button><p class=msg id=am></p></form>
<form class='panel form' id=cf><h3>Cek status</h3><p class=lead style='font-size:1rem'>Masukkan kode tiket yang kamu terima setelah mengirim pengaduan.</p><input id=kode placeholder='Contoh: BGN-AB12C' required><button class='btn ghost'>Cek status</button><p class=msg id=cm></p></form></div></main><script src="assets/app.js"></script><script src="assets/aduan.js"></script></body></html>
